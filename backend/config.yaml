llm:
  provider: groq
  model: openai/gpt-oss-120b   # Groq'ta llama-3.3-70b-versatile artık yok (404 model_not_found)
  max_tokens: 1000
  temperature: 0.7

content:
  base_path: ../content
  chunk_size: 1000
  chunk_overlap: 200
  top_k_chunks: 3

gap_detection:
  question_threshold: 5       # aynı görevde kaç soru = boşluk sinyali (SRS: 3; commit 537b050'de 5'e çıkarıldı)
  time_multiplier: 2.0        # tahmini sürenin kaç katı geçince boşluk sinyali

server:
  cors_origins:            # frontend'in çalıştığı adres(ler); deploy'da değiştir
    - http://localhost:3000

auth:
  token_expire_minutes: 480
